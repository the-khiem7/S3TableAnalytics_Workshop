baseURL = "/"
relativeURLs = false
canonifyURLs = false
defaultContentLanguage = "en"
ignoreFiles = ['(?:^|/)_tools(?:/|$)']

theme = "hugo-theme-learn"

[outputs]
home = ["HTML", "RSS", "JSON"]

[params]
themeVariant = "workshop"
editURL = ""
description = "Amazon S3 Tables Hands-on Lab with AWS Analytics Services - Bilingual (EN/VI) workshop documentation."
author = "thienlh@thienlu.com"
showVisitedLinks = true
disableBreadcrumb = false
disableNextPrev = false

[Languages]
[Languages.en]
title = "Amazon S3 Tables Hands-on Lab"
weight = 1
label = "English"

[Languages.vi]
title = "Amazon S3 Tables Hands-on Lab"
weight = 2
label = "Tiếng Việt"

[markup]
[markup.goldmark]
[markup.goldmark.renderer]
unsafe = true
